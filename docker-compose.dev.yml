# Override para desarrollo local a partir del código fuente, en vez de bajar
# las imágenes publicadas en ghcr.io. Pensado para cuando tenés los 3 repos
# clonados como carpetas hermanas (backend/, frontend/, infra/ al mismo nivel)
# — que es exactamente la estructura de este monorepo hoy.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# No hace falta GHCR_OWNER para esto: este archivo reemplaza el "image:" del
# archivo base por un "build:" local, así que ese valor nunca se usa.

services:
  backend:
    build:
      context: ../backend
    image: artagram-backend:dev

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    image: artagram-frontend:dev
